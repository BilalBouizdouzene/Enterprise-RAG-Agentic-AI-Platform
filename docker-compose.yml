services:
  api:
    build: .
    command: uvicorn enterprise_rag.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-enterprise_chunks}
      REDIS_URL: redis://redis:6379/0
      INDEXING_MODE: async
      INDEXING_API_URL: http://api:8000
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-enterprise-documents}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-northstar}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-password}
      LLM_PROVIDER: ${LLM_PROVIDER:-template}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    command: python scripts/worker.py
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_KEY: ${API_KEY:-}
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-enterprise_chunks}
      REDIS_URL: redis://redis:6379/0
      INDEXING_API_URL: http://api:8000
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-enterprise-documents}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-northstar}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-password}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_platform}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-northstar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-password}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"

  mlflow:
    image: python:3.12-slim
    command: python -m mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    profiles: ["tracking"]
    ports:
      - "5000:5000"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
