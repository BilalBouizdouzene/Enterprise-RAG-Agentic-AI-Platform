[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-agentic-ai"
version = "0.1.0"
description = "Portfolio-grade enterprise RAG and agentic AI platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.6,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "python-docx>=1.1,<2",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9,<2"]
retrieval = [
  "sentence-transformers>=3.0,<4",
  "transformers>=4.40,<5",
]
agent = ["langgraph>=0.2,<1", "langchain-core>=0.3,<1"]
tracking = ["mlflow>=2.12,<3"]
production = ["boto3>=1.34,<2", "redis>=5,<6"]
documents = []
frontend = ["streamlit>=1.35,<2"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0,<6", "ruff>=0.5,<1"]
all = [
  "enterprise-rag-agentic-ai[qdrant,retrieval,agent,tracking,production,documents,frontend,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
